name: Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 17 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download and verify Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --location --silent --show-error \
            --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error \
            --output checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "  $archive$" checksums.txt | sha256sum --check -
          tar -xzf "$archive" gitleaks
          ./gitleaks version

      - name: Scan repository history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ./gitleaks git . \
            --redact \
            --verbose \
            --report-format json \
            --report-path artifacts/gitleaks-report.json

      - name: Upload Gitleaks evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gitleaks-report
          path: artifacts/gitleaks-report.json
          if-no-files-found: warn
          retention-days: 30
