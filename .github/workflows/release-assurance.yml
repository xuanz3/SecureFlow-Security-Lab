name: Release Assurance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate release assurance
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Validate v1.0.1 reports and evidence
        run: >-
          python3 security-assessment/tools/validate_release_assurance.py
          --root .
          --output-json /tmp/release-assurance.json
          --output-md /tmp/release-assurance.md
