name: DAST

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap-baseline:
    name: ZAP baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Generate ephemeral CI configuration
        shell: bash
        run: |
          set -euo pipefail
          random_password() {
            printf 'CiOnly!%sAa9' "$(openssl rand -hex 12)"
          }
          {
            echo "POSTGRES_PASSWORD=$(random_password)"
            echo "SEED_ADMIN_EMAIL=admin@example.test"
            echo "SEED_ADMIN_PASSWORD=$(random_password)"
            echo "SEED_ALICE_EMAIL=alice@example.test"
            echo "SEED_ALICE_PASSWORD=$(random_password)"
            echo "SEED_BOB_EMAIL=bob@example.test"
            echo "SEED_BOB_PASSWORD=$(random_password)"
          } > "$RUNNER_TEMP/secureflow.env"

      - name: Start isolated application
        run: |
          docker compose \
            --project-name secureflow-ci \
            --env-file "$RUNNER_TEMP/secureflow.env" \
            --file infrastructure/docker/compose.yml \
            up --build --detach

      - name: Wait for readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..90}; do
            if curl --fail --silent http://localhost:8080/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose \
            --project-name secureflow-ci \
            --env-file "$RUNNER_TEMP/secureflow.env" \
            --file infrastructure/docker/compose.yml \
            logs --no-color
          exit 1

      - name: Run passive ZAP baseline gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          chmod 777 artifacts
          cp security/zap/baseline.conf artifacts/zap-baseline.conf
          docker run --rm \
            --network secureflow-ci_default \
            --volume "$PWD/artifacts:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2 \
            zap-baseline.py \
            -t http://app:8080 \
            -m 1 \
            -I \
            -c /zap/wrk/zap-baseline.conf \
            -r zap-report.html \
            -w zap-report.md \
            -J zap-report.json

      - name: Upload ZAP evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zap-baseline-report
          path: |
            artifacts/zap-report.html
            artifacts/zap-report.md
            artifacts/zap-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Stop isolated application
        if: always()
        run: |
          docker compose \
            --project-name secureflow-ci \
            --env-file "$RUNNER_TEMP/secureflow.env" \
            --file infrastructure/docker/compose.yml \
            down --volumes --remove-orphans
