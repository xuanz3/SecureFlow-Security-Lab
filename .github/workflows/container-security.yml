name: Container Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: container-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-security:
    name: Build, scan and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build local scan image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          load: true
          push: false
          tags: secureflow-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create artifact directory
        run: mkdir -p artifacts

      - name: Scan image and create SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: secureflow-ci:${{ github.sha }}
          format: sarif
          output: artifacts/trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Scan repository configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: artifacts/trivy-config.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload image findings to code scanning
        if: always() && hashFiles('artifacts/trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@18420e3271f74589575af831a523c833acda327f
        with:
          sarif_file: artifacts/trivy-image.sarif
          category: trivy-container

      - name: Upload configuration findings to code scanning
        if: always() && hashFiles('artifacts/trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@18420e3271f74589575af831a523c833acda327f
        with:
          sarif_file: artifacts/trivy-config.sarif
          category: trivy-configuration

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: secureflow-ci:${{ github.sha }}
          format: cyclonedx-json
          output-file: artifacts/secureflow.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Enforce critical vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: secureflow-ci:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload container security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: container-security-evidence
          path: |
            artifacts/trivy-image.sarif
            artifacts/trivy-config.sarif
            artifacts/secureflow.cdx.json
          if-no-files-found: warn
          retention-days: 30
