services:
  db:
    image: postgres:17-alpine
    restart: "no"
    environment:
      POSTGRES_DB: secureflow
      POSTGRES_USER: secureflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - recovery-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureflow -d secureflow"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    image: ${SECUREFLOW_IMAGE}
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=67108864
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      AllowedHosts: "localhost;127.0.0.1;app"
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=secureflow;Username=secureflow;Password=${POSTGRES_PASSWORD}
      SeedUsers__AdminEmail: ${SEED_ADMIN_EMAIL}
      SeedUsers__AdminPassword: ${SEED_ADMIN_PASSWORD}
      SeedUsers__AliceEmail: ${SEED_ALICE_EMAIL}
      SeedUsers__AlicePassword: ${SEED_ALICE_PASSWORD}
      SeedUsers__BobEmail: ${SEED_BOB_EMAIL}
      SeedUsers__BobPassword: ${SEED_BOB_PASSWORD}
    ports:
      - "127.0.0.1:${RECOVERY_APP_PORT}:8080"
    volumes:
      - recovery-uploads:/app/App_Data/uploads
      - recovery-quarantine:/app/App_Data/quarantine
      - recovery-data-protection:/home/appuser/.aspnet/DataProtection-Keys

volumes:
  recovery-postgres:
  recovery-uploads:
  recovery-quarantine:
  recovery-data-protection:
